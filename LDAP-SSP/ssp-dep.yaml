
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssp-ldap
  namespace: authentication
  labels:
    app: ssp-ldap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ssp-ldap
  template:
    metadata:
      labels:
        app: ssp-ldap
    spec:
      containers:
      - name: ssp-ldap
        image: ishanhansika/self-service-password:latest
        ports:
        - containerPort: 80
        volumeMounts:
#        - name: es-config-dir1
 #         mountPath: /var/www/conf/config.inc.php
 #         subPath: config.inc.php
        
        - name: es-config-dir2
          mountPath: /var/www/css/custom.css
          subPath: custom.css

#        - name: es-persistent-storage
#          mountPath: /var/www/htdocs/images
#          subPath: campus-photo1.jpg       
        - name: es-config-dir3
          mountPath: /var/www/conf/config.inc.local.php
          subPath: config.inc.local.php


      volumes:
  #    - name: es-config-dir1
   #     configMap:
  #        name: es-config-map1
      - name: es-config-dir2
        configMap:
          name: es-config-map2
      - name: es-config-dir3
        configMap:
          name: es-config-map3
 #     - name: es-persistent-storage
 #       persistentVolumeClaim:
 #         claimName: es-pv-claim

