apiVersion: v1
kind: Service
metadata:
  name: ssp-nordeport
  namespace: authentication
spec:
  selector:
    app: ssp-ldap
  ports:
    - protocol: TCP
      port: 8081         # Service port
      targetPort: 81   # container port
      nodePort: 30081  # Port on nodes (30000-32767)
  type: NodePort
