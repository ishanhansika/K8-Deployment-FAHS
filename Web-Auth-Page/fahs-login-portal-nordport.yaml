apiVersion: v1
kind: Service
metadata:
  name: fahs-loging-portl-nodeport
  namespace: authentication
spec:
  selector:
    app: fahs-portal 
  ports:
    - protocol: TCP
      port: 8080         # Service port
      targetPort: 80   # container port
      nodePort: 30080  # Port on nodes (30000-32767)
  type: NodePort
