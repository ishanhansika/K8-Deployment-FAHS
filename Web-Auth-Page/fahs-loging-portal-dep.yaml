
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fahs-portal
  namespace: authentication
  labels:
    app: fahs-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fahs-portal
  template:
    metadata:
      labels:
        app: fahs-portal
    spec:
      containers:
      - name: fahs-portal
        image: ishanhansika/loging-portl
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: fahs-portal-configmap
