apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentication-ingress
  namespace: authentication
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-redirect-from: "http://portal.ahs.ruh.ac.lk/"
    nginx.ingress.kubernetes.io/proxy-redirect-to: "http://portal.ahs.ruh.ac.lk/account/"
spec:
  ingressClassName: "nginx"
  rules:
  - host: portal.ahs.ruh.ac.lk
    http:
      paths:
      - path: /()(.*)
        pathType: Prefix
        backend:
          service:
            name: fahs-portal-service
            port:
              number: 80
      - path: /account(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: ssp-service
            port:
              number: 80
